services:
  db:
    image: postgres:16
    container_name: nba_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: nba_db
    ports:
      - "5432:5432"
    volumes:
      - nba_db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  nba_db_data:
